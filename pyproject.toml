# Build only. Package metadata lives in setup.py, which is what
# setuptools.build_meta reads — the [tool.poetry] table that used to sit here
# was read by nothing (no workflow, script or Makefile in this repo invokes
# poetry) and disagreed with setup.py on the two facts that matter: it named
# version 1.0.0 against setup.py's 1.0.1, and python >=3.14 against >=3.8. A
# second set of metadata that no build consults is a second answer to every
# question and the one a reader is more likely to find first.
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
